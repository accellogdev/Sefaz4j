; O AGRUPAMENTO de UFs por autorizador compartilhado difere do agrupamento usado
; para NFe: só MG/MS/MT/PR/SP têm autorizador próprio para CTeRecepcaoSinc; AP/PE/RR
; usam o mesmo autorizador de SP (Usar=CTE_SP_*); as demais 19 UFs usam SVRS
; (incluindo MA, que para NFe usa SVAN mas para CTe usa SVRS).

