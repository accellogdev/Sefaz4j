; Fonte: ACBrCTeServicos.ini (projeto ACBr, biblioteca open-source amplamente usada
; para integracao com SEFAZ no Brasil) — mesma proveniencia/confianca do
; nfe-servicos.ini original. Chaves de servico CTeRecepcaoSinc_4.00,
; CTeConsultaProtocolo_4.00 e RecepcaoEvento_4.00 (com sufixo de versao, igual ao
; padrao ja usado em nfe-servicos.ini).
